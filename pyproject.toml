[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-rag-recommender"
version = "0.1.0"
description = "LLM-powered fashion product recommendations via a RAG pipeline: embedding-based retrieval, contextual ranking, and prompt-optimized generation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
sbert = ["sentence-transformers>=2.2"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=7.4", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]
